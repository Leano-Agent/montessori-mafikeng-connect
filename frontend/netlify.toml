# Site information
[site]
  name = "Montessori Mafikeng Connect"
  description = "African Montessori educational platform with Setswana-first design and offline capabilities"
  url = "https://montessori-mafikeng.connect"
  locale = "en_ZA"
  timezone = "Africa/Johannesburg"

