name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # Manual trigger
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Test and build
  test-and-build:
    runs-on: ubuntu-latest
    outputs:
      frontend-image: ${{ steps.build-frontend.outputs.image }}
      backend-image: ${{ steps.build-backend.outputs.image }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Generate version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y%m%d')
          echo "version=${DATE}.${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "VERSION=${DATE}.${SHORT_SHA}" >> $GITHUB_ENV

      - name: Run frontend tests
        if: ${{ !inputs.skip_tests || github.event_name == 'push' }}
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test -- --passWithNoTests

      - name: Run backend tests
        if: ${{ !inputs.skip_tests || github.event_name == 'push' }}
        run: |
          cd backend
          npm ci
          npm run lint
          npm test -- --passWithNoTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Deploy to Railway (Backend)
  deploy-backend-railway:
    needs: test-and-build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          railway version

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}
        run: |
          railway link $RAILWAY_PROJECT_ID
          railway up --service $RAILWAY_SERVICE_ID --detach

      - name: Run database migrations
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}
        run: |
          railway run --service $RAILWAY_SERVICE_ID "npx prisma migrate deploy"

      - name: Health check
        run: |
          sleep 30  # Wait for deployment to stabilize
          BACKEND_URL=${{ secrets.PRODUCTION_BACKEND_URL }}
          curl -f $BACKEND_URL/api/health || exit 1

  # Deploy to Vercel (Frontend)
  deploy-frontend-vercel:
    needs: test-and-build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'

      - name: Health check
        run: |
          sleep 30  # Wait for deployment to stabilize
          FRONTEND_URL=${{ secrets.PRODUCTION_FRONTEND_URL }}
          curl -f $FRONTEND_URL || exit 1

  # Deploy to Render (Alternative Backend)
  deploy-backend-render:
    needs: test-and-build
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

  # Deploy to Netlify (Alternative Frontend)
  deploy-frontend-netlify:
    needs: test-and-build
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: './frontend/dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # Deploy to Docker Swarm/Compose
  deploy-docker:
    needs: test-and-build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker context
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd /opt/montessori-mafikeng-connect
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ needs.test-and-build.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ needs.test-and-build.outputs.version }}
            docker-compose -f docker-compose.prod.yml up -d
          "

  # Run integration tests after deployment
  integration-tests:
    needs: [deploy-backend-railway, deploy-frontend-vercel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Run API integration tests
        run: |
          BACKEND_URL=${{ secrets.PRODUCTION_BACKEND_URL }}
          curl -f $BACKEND_URL/api/health || exit 1
          # Add more integration tests here

      - name: Run frontend integration tests
        run: |
          FRONTEND_URL=${{ secrets.PRODUCTION_FRONTEND_URL }}
          curl -f $FRONTEND_URL || exit 1

  # Notify on success
  notify-success:
    needs: [deploy-backend-railway, deploy-frontend-vercel, integration-tests]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: success
          author_name: GitHub Actions
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Update deployment status
        run: |
          echo "Deployment completed successfully at $(date)"
          echo "Frontend: ${{ secrets.PRODUCTION_FRONTEND_URL }}"
          echo "Backend: ${{ secrets.PRODUCTION_BACKEND_URL }}"

  # Notify on failure
  notify-failure:
    needs: [deploy-backend-railway, deploy-frontend-vercel, integration-tests]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          author_name: GitHub Actions
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Deployment Failed: Montessori Mafikeng Connect"
          to: ${{ secrets.ADMIN_EMAIL }}
          from: GitHub Actions
          body: |
            Deployment failed for Montessori Mafikeng Connect.
            
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
            Job: ${{ github.job }}
            
            Please check the logs for details.

  # Create release tag
  create-release:
    needs: [deploy-backend-railway, deploy-frontend-vercel]
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git tag
        run: |
          TAG="v${{ needs.test-and-build.outputs.version }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a $TAG -m "Release $TAG"
          git push origin $TAG

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.test-and-build.outputs.version }}
          name: Release v${{ needs.test-and-build.outputs.version }}
          body: |
            ## Montessori Mafikeng Connect Release
            
            **Version:** ${{ needs.test-and-build.outputs.version }}
            **Date:** $(date)
            
            ### Changes
            - Automated deployment
            - Updated dependencies
            - Performance improvements
            
            ### Deployment Status
            ✅ Frontend: ${{ secrets.PRODUCTION_FRONTEND_URL }}
            ✅ Backend: ${{ secrets.PRODUCTION_BACKEND_URL }}
            
            ### Docker Images
            - Frontend: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ needs.test-and-build.outputs.version }}`
            - Backend: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ needs.test-and-build.outputs.version }}`
          draft: false
          prerelease: false

  # Cleanup old images
  cleanup:
    needs: [deploy-backend-railway, deploy-frontend-vercel]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old Docker images
        run: |
          # Keep last 5 images, delete older ones
          echo "Image cleanup would run here"
          # Actual implementation depends on registry