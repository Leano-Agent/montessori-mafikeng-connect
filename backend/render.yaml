services:
  - type: web
    name: montessori-mafikeng-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
        # Supabase pooler (PgBouncer) connection:
        # postgresql://user.abc123:[PASSWORD]@aws-0-af-south-1.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=1
      - key: DIRECT_URL
        sync: false
        # Direct connection for Prisma migrations (port 5432, bypasses PgBouncer):
        # postgresql://user.abc123:[PASSWORD]@aws-0-af-south-1.pooler.supabase.com:5432/postgres
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_RESET_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: af-south-1
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: AFRICAS_TALKING_USERNAME
        sync: false

databases:
  - name: montessori-db
    databaseName: montessori_mafikeng
    user: montessori_user
    plan: free

redis:
  - name: montessori-redis
    plan: free