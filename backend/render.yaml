services:
  - type: web
    name: montessori-mafikeng-backend
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && node src/index.ts
    healthCheckPath: /api/health
    runtime: node
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
        # Supabase pooler (PgBouncer) connection:
        # postgresql://postgres.efkfpfmkgknzfaumeqmx:[PASSWORD]@aws-0-eu-central-1.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=1
      - key: DIRECT_URL
        sync: false
        # Direct connection for Prisma migrations (port 5432, bypasses PgBouncer):
        # postgresql://postgres.efkfpfmkgknzfaumeqmx:[PASSWORD]@aws-0-eu-central-1.pooler.supabase.com:5432/postgres
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_RESET_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://montessori-mafikeng-connect.vercel.app
      - key: CORS_ORIGIN
        value: https://montessori-mafikeng-connect.vercel.app

    # ── Optional / empty-by-default ──
      - key: REDIS_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: af-south-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: AFRICAS_TALKING_USERNAME
        sync: false
      - key: AFRICAS_TALKING_SENDER_ID
        value: MONTESSORI
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_SWAGGER
        value: "true"
